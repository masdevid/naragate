tools:
  - name: sectors_company_report
    description: Fetch company report from Sectors v2 API (valuation, overview, financials sections)
    parameters:
      ticker: string
      sections: string[]
    returns: CompanyReport

  - name: sectors_quarterly_financials
    description: Fetch quarterly financials from Sectors v2 API
    parameters:
      ticker: string
      n_quarters: number
    returns: QuarterlyFinancials[]

  - name: sectors_segments
    description: Fetch the revenue-segment breakdown for a company from Sectors v2 API
    parameters:
      ticker: string
      financial_year: number
    returns: RevenueSegments

  - name: evidence_cache_get
    description: Read the full Evidence Graph for a ticker from the cache
    parameters:
      ticker: string
    returns: EvidenceGraph | null

  - name: evidence_cache_merge
    description: Atomically merge one section into the cached Evidence Graph for a ticker
    parameters:
      ticker: string
      key: string
      value: object
    returns: void