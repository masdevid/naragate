[project]
name = "naragate-mcp"
version = "0.5.0"
description = "MCP server exposing the Naragate reality-gap evidence engine to any MCP-capable agent (desktop, CLI, IDE)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Devid HW", email = "devid.wahid@gmail.com" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "claude",
    "cursor",
    "opencode",
    "codex",
    "stock",
    "indonesia",
    "idx",
    "sectors",
    "fact-check",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
naragate-mcp = "naragate_mcp.server:main"

[project.urls]
Homepage = "https://github.com/masdevid/naragate"
Repository = "https://github.com/masdevid/naragate"
Issues = "https://github.com/masdevid/naragate/issues"
Changelog = "https://github.com/masdevid/naragate/releases"
Documentation = "https://github.com/masdevid/naragate/blob/master/mcp/README.md"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["naragate_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
