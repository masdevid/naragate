<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Naragate Teaser — Scene 6: CTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0B0E17; --line: rgba(255,255,255,.09);
    --text-primary:#F4F6FB; --text-muted:#8791A8;
    --brand-from:#E31C5F; --brand-to:#F5A623;
    --font-display:'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#000;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .canvas{
    width:1280px;height:720px;position:relative;overflow:hidden;
    background:
      radial-gradient(ellipse 900px 500px at 18% -8%, rgba(227,28,95,.16), transparent 55%),
      radial-gradient(ellipse 900px 500px at 102% 112%, rgba(245,166,35,.12), transparent 55%),
      var(--bg-deep);
    font-family:var(--font-mono); color:var(--text-primary);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .progress{position:absolute;top:28px;right:36px;display:flex;gap:8px;z-index:6;}
  .progress i{width:7px;height:7px;border-radius:50%;background:var(--line);}
  .progress i.on{background:var(--brand-to);}

  /* 💫 breathing evidence ring, echoes the scene-2 gauge for continuity */
  .ring{
    position:absolute;width:420px;height:420px;border-radius:50%;
    border:1px solid rgba(245,166,35,.28);
    opacity:0;animation:ringIn 1s ease-out forwards, pulse 3.2s ease-in-out infinite;
    animation-delay:.1s, 1.1s;
  }
  .ring.r2{width:520px;height:520px;border-color:rgba(227,28,95,.18);animation-delay:.3s, 1.3s;}
  @keyframes ringIn{ to{opacity:1;} }
  @keyframes pulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.035); } }

  .wordmark{
    font-family:var(--font-display);font-weight:700;font-size:80px;display:inline-flex;user-select:none;
    opacity:0;transform:scale(.85);animation:heroIn .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:1.2s;
  }
  .wordmark .nara{background:linear-gradient(90deg,var(--brand-from),var(--brand-to));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .wordmark .gate{color:#fff;}
  @keyframes heroIn{ to{opacity:1;transform:scale(1);} }

  .tagline{
    margin-top:18px;font-family:var(--font-display);font-weight:500;font-size:24px;color:var(--text-primary);
    opacity:0;animation:fadeUp .5s ease-out forwards;animation-delay:3.1s;
  }
  .url{
    margin-top:26px;font-size:20px;color:var(--brand-to);letter-spacing:.01em;
    opacity:0;animation:fadeUp .5s ease-out forwards;animation-delay:4.6s;
  }
  .badge{
    margin-top:22px;font-size:13px;color:var(--text-muted);
    border:1px solid var(--line);border-radius:999px;padding:8px 18px;
    opacity:0;animation:fadeUp .5s ease-out forwards;animation-delay:6.1s;
  }
  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
</style>
</head>
<body>
  <div class="canvas">
    <div class="progress"><i></i><i></i><i></i><i></i><i></i><i class="on"></i></div>
    <div class="ring r2"></div>
    <div class="ring"></div>

    <span class="wordmark"><span class="nara">NARA</span><span class="gate">GATE</span></span>
    <div class="tagline">Verifikasi. Deteksi. Skor Realitas.</div>
    <div class="url">naragate.ilkomers.com</div>
    <div class="badge">Sectors Hackathon 2026 · Track 1</div>
  </div>

  <p id="tts-script" hidden>Naragate — verifikasi klaim, deteksi dampak kebijakan, skor celah realitas. Coba sekarang di naragate titik ilkomers titik com.</p>
  <script type="application/json" id="tts-meta">{"lang":"id-ID","scene":6,"duration_seconds":10}</script>
  <script>
    window.addEventListener('load', () => {
      if (!('speechSynthesis' in window)) return;
      const u = new SpeechSynthesisUtterance(document.getElementById('tts-script').textContent.trim());
      u.lang = 'id-ID'; u.rate = 0.97;
      setTimeout(() => speechSynthesis.speak(u), 250);
    });
  </script>
</body>
</html>
