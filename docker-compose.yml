services:
  backend:
    build: ./backend
    ports:
      # Bind to loopback only — the app is served publicly via Caddy
      # (naragate.ilkomers.com -> localhost:4273 -> backend). Exposing this
      # on 0.0.0.0 would let the public IP reach the backend directly.
      - "127.0.0.1:${BACKEND_PORT:-5678}:5678"
    environment:
      - SECTORS_API_KEY=${SECTORS_API_KEY}
      - SECTORS_DEV_IPS=${SECTORS_DEV_IPS:-127.0.0.1,172.21.0.1}
      - SECTORS_ENFORCE_PER_IP=${SECTORS_ENFORCE_PER_IP:-false}
      - SECTORS_OAUTH_ACCESS_TOKEN=${SECTORS_OAUTH_ACCESS_TOKEN:-}
      - SECTORS_OAUTH_CLIENT_ID=${SECTORS_OAUTH_CLIENT_ID:-}
      - SECTORS_OAUTH_CLIENT_SECRET=${SECTORS_OAUTH_CLIENT_SECRET:-}
      - SECTORS_OAUTH_REFRESH_TOKEN=${SECTORS_OAUTH_REFRESH_TOKEN:-}
      - SECTORS_ACCOUNT_EMAIL=${SECTORS_ACCOUNT_EMAIL:-}
      - SECTORS_ACCOUNT_PASSWORD=${SECTORS_ACCOUNT_PASSWORD:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=sqlite:///./data/naragate.db
      - PI_AGENT_URL=http://pi-agent:3000
    depends_on:
      - redis
      - pi-agent
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 5678

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4274}:4273"
    depends_on:
      - backend

  pi-agent:
    build: ./pi-agent
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-https://dev.idh.am/v1}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3-coder:30b}
      - PI_PROVIDER=ollama
      - PI_API_KEY=${PI_AGENT_API_KEY:-ollama}
      - PI_SKILLS_DIR=/app/skills
    volumes:
      - ./.pi:/app/.pi
      - ./skills:/app/skills
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

volumes:
  backend_data:
  redis_data:
