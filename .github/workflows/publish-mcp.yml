name: Publish naragate-mcp

# Publishes the `mcp/` package to PyPI. Runs when a GitHub release is published,
# or on demand via `gh workflow run publish-mcp.yml` (both upload).
#
# Authentication uses PyPI Trusted Publishing (OIDC) — no API token secret.
# One-time setup on PyPI (project → Publishing → Add a new publisher):
#   Owner: masdevid · Repository: naragate · Workflow: publish-mcp.yml · Environment: pypi
# https://pypi.org/manage/project/naragate-mcp/settings/publishing/

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" build twine

      - name: Run tests
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: naragate-mcp-dist
          path: mcp/dist/*

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/naragate-mcp
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
      contents: read
      actions: read     # download-artifact
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: naragate-mcp-dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
